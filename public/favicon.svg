<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Logo Bambu Water Nusantara">
  <defs>
    <linearGradient id="bwn-green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d5c3a"/>
      <stop offset="55%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#0c3a20"/>
    </linearGradient>
    <linearGradient id="bwn-stalk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9fd468"/>
      <stop offset="100%" stop-color="#5ea34a"/>
    </linearGradient>
    <linearGradient id="bwn-drop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bfeaf4"/>
      <stop offset="100%" stop-color="#6cc7c0"/>
    </linearGradient>
    <linearGradient id="bwn-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8c766"/>
      <stop offset="100%" stop-color="#b98a2e"/>
    </linearGradient>
  </defs>
  <!-- Cincin emas -->
  <circle cx="60" cy="60" r="56" fill="url(#bwn-green)" stroke="url(#bwn-gold)" stroke-width="3.5"/>
  <!-- Ornamen titik emas -->
  <g fill="url(#bwn-gold)">
    <circle cx="60" cy="11" r="2.2"/>
    <circle cx="60" cy="109" r="2.2"/>
    <circle cx="11" cy="60" r="2.2"/>
    <circle cx="109" cy="60" r="2.2"/>
  </g>
  <!-- Batang bambu -->
  <g stroke-linecap="round">
    <g transform="translate(38 26) rotate(-6)">
      <rect x="0" y="0" width="9" height="68" rx="4.5" fill="url(#bwn-stalk)"/>
      <line x1="0" y1="16" x2="9" y2="16" stroke="#0c3a20" stroke-width="2.2"/>
      <line x1="0" y1="34" x2="9" y2="34" stroke="#0c3a20" stroke-width="2.2"/>
      <line x1="0" y1="52" x2="9" y2="52" stroke="#0c3a20" stroke-width="2.2"/>
    </g>
    <g transform="translate(56 20) rotate(2)">
      <rect x="0" y="0" width="11" height="74" rx="5.5" fill="url(#bwn-stalk)"/>
      <line x1="0" y1="18" x2="11" y2="18" stroke="#0c3a20" stroke-width="2.4"/>
      <line x1="0" y1="38" x2="11" y2="38" stroke="#0c3a20" stroke-width="2.4"/>
      <line x1="0" y1="58" x2="11" y2="58" stroke="#0c3a20" stroke-width="2.4"/>
    </g>
    <g transform="translate(75 27) rotate(8)">
      <rect x="0" y="0" width="9" height="66" rx="4.5" fill="url(#bwn-stalk)"/>
      <line x1="0" y1="15" x2="9" y2="15" stroke="#0c3a20" stroke-width="2.2"/>
      <line x1="0" y1="33" x2="9" y2="33" stroke="#0c3a20" stroke-width="2.2"/>
      <line x1="0" y1="51" x2="9" y2="51" stroke="#0c3a20" stroke-width="2.2"/>
    </g>
  </g>
  <!-- Tetesan air -->
  <path d="M60 68 C60 68 46 84 46 93.5 A14 14 0 0 0 74 93.5 C74 84 60 68 60 68 Z" fill="url(#bwn-drop)" stroke="#eaf9ff" stroke-width="1.6"/>
  <!-- Kilau tetesan -->
  <circle cx="54.5" cy="90" r="3" fill="#ffffff" opacity="0.9"/>
</svg>
